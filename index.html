<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b3d91" />
  <link rel="icon" type="image/png" href="img/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Space Explorer" />
</head>
<body>
  <!-- Offline indicator -->
  <div id="offlineBanner" class="offline-banner" role="status" aria-live="polite" hidden>
    📡 You're offline. Showing saved images where available.
  </div>

  <!-- Custom install prompt -->
  <div id="installBanner" class="install-banner" role="dialog" aria-labelledby="installTitle" hidden>
    <img src="img/icons/icon-192.png" alt="" class="install-icon" />
    <div class="install-text">
      <strong id="installTitle">Install Space Explorer</strong>
      <span>Add it to your device for quick, offline-ready access.</span>
    </div>
    <div class="install-actions">
      <button id="installButton" class="install-btn" type="button">Install</button>
      <button id="installDismiss" class="install-dismiss" type="button">Not now</button>
    </div>
  </div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="app-actions">
      <button id="notifyButton" class="notify-btn" type="button">🔔 Enable notifications</button>
    </div>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesButton" type="button">Get Space Images</button>
    </div>

    <div id="spaceFact" class="space-fact"></div>
    
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

    <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalMedia"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation"></p>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
